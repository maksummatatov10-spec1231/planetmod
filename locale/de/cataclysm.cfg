[technology-description]
cataclysm-planet-discovery=Öffnet die Route zum Kataklysmus — einer sturmzerrissenen Welt jenseits von Aquilo — und ermöglicht den Tiefraumflug dorthin.
cataclysm-condensate-extraction=Schaltet den Kondensatextraktor für die Seen des Kataklysmus frei.
cataclysm-stormite-processing=Schaltet das Schmelzen von Stormiterz zu Stormitplatten frei.
cataclysm-storm-siphon=Schaltet den Sturm-Siphon und das Aufladen von Kondensat frei.
cataclysm-astrite-refining=Schaltet die Veredelung von Astriterz zu Astrith-Kristallen frei.
cataclysm-voltaic-lattice=Schaltet das Voltaikgitter und den Sturmfabrikator frei.
cataclysmic-science-pack=Schaltet die Produktion des kataklysmischen Forschungspakets frei.
cataclysm-storm-generator=Schaltet den Sturmgenerator frei, der geladenes Kondensat verbrennt.
cataclysm-lightning-protection=Fügt Strommasten Blitzableiter hinzu, reduziert Blitzschaden und halbiert die Chance eines Einschlags in der Nähe des Spielers.
cataclysm-seismic-stabilization=Supersturm-Einschläge landen weit entfernt vom Spieler.
cataclysm-storm-platform-shield=Verbessert den Schutz gegen Stürme des tiefen Weltraums.
cataclysm-productivity=Erhöht die Produktivität der kataklysmischen Produktionskette.
cataclysm-storm-logistics=Verbessert die Logistik während der Stürme.

