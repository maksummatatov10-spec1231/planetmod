cataclysm=Ein Planeten-Mod für Factorio Space Age in der späten Spielphase: eine sturmzerrissene Welt jenseits von Aquilo mit eigenen Erzen, Kondensat-Wirtschaft, Forschungspaket, Technologien und Erfolgen.

