stormite-plate=Eine Platte aus Stormiterz, im Sturmkondensat gehärtet.
astrite-crystal=Ein Kristall, gezüchtet aus Astriterz in geladenem Kondensat.
cataclysm-voltaic-lattice=Ein Gitter aus Stormit und Astrith, das Blitzenergie speichert.
cataclysmic-science-pack=Ein Forschungspaket, destilliert aus der rohen Gewalt des Kataklysmus.
cataclysm-survey-pack=Ein Forschungspaket aus der Fernerkundung der Welt jenseits von Aquilo. Es bezahlt die Technologie, die den Weg zum Kataklysmus öffnet.
condensate-extractor=Pumpt Sturmkondensat direkt aus den Seen des Kataklysmus.
storm-siphon=Zieht Blitze an und speichert die Ladung als Energie.
storm-foundry=Schmilzt Erze und lädt Kondensat auf Kataklysmus auf.
storm-fabricator=Fertigt Gitter, Forschungspakete und Gebäude.
storm-generator=Verbrennt geladenes Kondensat zur Stromerzeugung.

