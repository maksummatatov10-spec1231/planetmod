cataclysm-stormite-processing=Открывает выплавку штормитовых пластин из штормитовой руды.
cataclysm-storm-siphon=Открывает грозовой сифон и зарядку конденсата грозовой энергией.
cataclysm-astrite-refining=Открывает очистку астритовой руды в кристаллы астрита.
cataclysm-voltaic-lattice=Открывает вольтовую решётку и штормовой фабрикатор.
cataclysmic-science-pack=Открывает производство катаклизмического научного пакета.
cataclysm-storm-generator=Открывает штормовой генератор, сжигающий заряженный конденсат.
cataclysm-lightning-protection=Снижает опасность штормов для ваших инженеров.
cataclysm-seismic-stabilization=Отводит удары супершторма от ваших инженеров.
cataclysm-storm-platform-shield=Улучшает защиту от штормов дальнего космоса.
cataclysm-productivity=Повышает продуктивность катаклизмической производственной цепочки.
cataclysm-storm-logistics=Улучшает логистику во время штормов.

