stormite-ore=Purple ore charged by constant lightning, found on Cataclysm.
astrite-ore=Silver-veined ore, harder than stormite, found deeper on Cataclysm.
stormite-plate=A plate hammered from stormite ore and quenched in storm condensate.
astrite-crystal=A crystal grown from astrite ore in charged condensate.
cataclysm-voltaic-lattice=A lattice of stormite and astrite that stores lightning as energy.
cataclysmic-science-pack=A science pack distilled from the raw violence of Cataclysm.
condensate-extractor=Pumps storm condensate straight from the lakes of Cataclysm.
storm-siphon=Draws lightning to itself and stores the charge as energy.
storm-foundry=Smelts ores and charges condensate on Cataclysm.
storm-fabricator=Crafts lattices, science packs and machines.
storm-generator=Burns charged condensate to produce electricity.

