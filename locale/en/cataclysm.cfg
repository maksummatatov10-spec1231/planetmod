[technology-description]
cataclysm-condensate-extraction=Unlocks the condensate extractor for pumping storm condensate from the lakes of Cataclysm.
cataclysm-stormite-processing=Unlocks smelting of stormite ore into stormite plates.
cataclysm-storm-siphon=Unlocks the storm siphon and the charging of condensate with storm energy.
cataclysm-astrite-refining=Unlocks refining of astrite ore into astrite crystals.
cataclysm-voltaic-lattice=Unlocks the voltaic lattice and the storm fabricator.
cataclysmic-science-pack=Unlocks production of the cataclysmic science pack.
cataclysm-storm-generator=Unlocks the storm generator that burns charged condensate for electricity.
cataclysm-lightning-protection=Adds lightning rods to power poles, reduces lightning damage and halves the chance of a strike landing near the player.
cataclysm-seismic-stabilization=Superstorm strikes land far away from the player.
cataclysm-storm-platform-shield=Improves shielding against the storms of deep space.
cataclysm-productivity=Increases productivity of the cataclysmic production chain.
cataclysm-storm-logistics=Improves logistics during storms.

